<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smarthouse</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg: #0b1220;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.08);
      --stroke: rgba(255,255,255,0.12);
      --text: rgba(245,250,255,0.92);
      --muted: rgba(245,250,255,0.60);

      --heat: #ff7a18;
      --cool: #2ea6ff;

      --danger: #ff3b30;
      --success: #34c759;

      --tg-bg: var(--tg-theme-bg-color, var(--bg));
      --tg-text: var(--tg-theme-text-color, var(--text));
      --tg-hint: var(--tg-theme-hint-color, var(--muted));
    }

    * { box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: var(--tg-bg);
      color: var(--tg-text);
    }

    .wrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 14px 14px 92px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 4px 2px 10px;
    }
    .topbar .left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .pill{
      width: 28px; height: 28px;
      border-radius: 9px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      display:flex; align-items:center; justify-content:center;
      color: var(--tg-text);
      flex: 0 0 auto;
      user-select:none;
    }
    .homeTitle{
      display:flex;
      align-items:center;
      gap:6px;
      min-width:0;
    }
    .homeTitle .name{
      font-weight: 650;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .topbar .right{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .sectionRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 6px 2px 10px;
      color: var(--tg-hint);
      font-size: 13px;
    }
    .sectionRow .secLeft{
      display:flex; align-items:center; gap:8px;
      min-width:0;
    }
    .secDot{
      width: 10px; height: 10px;
      border-radius: 3px;
      background: rgba(255,255,255,0.22);
      border: 1px solid var(--stroke);
      flex: 0 0 auto;
    }
    .sectionRow .more{
      color: var(--tg-hint);
      opacity: .9;
      user-select:none;
    }

    .card{
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .metaRow{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      color: var(--tg-hint);
      font-size: 13px;
      padding-bottom: 4px;
    }

    .badge{
      display:flex; align-items:center; gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,122,24,0.35);
      background: rgba(255,122,24,0.12);
      color: rgba(255,210,185,0.95);
      font-weight: 600;
    }
    .flame{ color: var(--heat); }

    .big{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px 0 6px;
    }
    .big .temp{
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }
    .big .unit{
      font-size: 22px;
      opacity: .75;
      margin-left: 6px;
      transform: translateY(-18px);
    }

    .setRow{
      display:flex;
      gap: 12px;
      justify-content:center;
      padding-top: 6px;
    }

    .setBtn{
      min-width: 126px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 11px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
      border: 1.5px solid var(--stroke);
      color: var(--tg-text);
      font-weight: 650;
      user-select:none;
      cursor:pointer;
    }
    .setBtn.center{
      min-width: 160px;
    }
    .setBtn.heat{
      border-color: rgba(255,122,24,0.55);
      color: rgba(255,210,185,0.98);
    }
    .dotHeat{
      width: 10px; height: 10px; border-radius: 4px;
      background: rgba(255,122,24,0.9);
      box-shadow: 0 0 12px rgba(255,122,24,0.35);
    }

    .controls{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      justify-content:center;
    }
    .ctrl{
      width: 46px; height: 46px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
      display:flex; align-items:center; justify-content:center;
      font-size: 22px;
      user-select:none;
      cursor:pointer;
      transition: border-color .15s ease, background .15s ease, color .15s ease;
    }

    /* ⇧ tugma holatlari */
    .ctrl.send.pending{
      border-color: rgba(255,59,48,0.65);
      background: rgba(255,59,48,0.16);
      color: rgba(255,210,210,0.98);
    }
    .ctrl.send.sent{
      border-color: rgba(52,199,89,0.65);
      background: rgba(52,199,89,0.16);
      color: rgba(220,255,230,0.98);
    }

    .subHint{
      text-align:center;
      color: var(--tg-hint);
      font-size: 12.5px;
      margin-top: 10px;
    }

    .bottomNav{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 10px 12px 18px;
      background: linear-gradient(180deg, rgba(11,18,32,0), rgba(11,18,32,0.95) 40%, rgba(11,18,32,0.98));
      backdrop-filter: blur(10px);
    }
    .navInner{
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 10px 10px;
      display:flex;
      justify-content:space-around;
      gap: 10px;
    }
    .navItem{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      padding: 8px 6px;
      border-radius: 14px;
      color: var(--tg-hint);
      font-size: 11.5px;
      user-select:none;
    }
    .navItem.active{
      background: rgba(46,166,255,0.10);
      border: 1px solid rgba(46,166,255,0.28);
      color: rgba(220,245,255,0.95);
    }
    .icon{
      width: 22px; height: 22px;
      border-radius: 7px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
      display:flex; align-items:center; justify-content:center;
      font-size: 13px;
    }

    /* Screens */
    .screen { display:none; }
    .screen.active { display:block; }
    .titleCenter{
      text-align:center;
      font-size:20px;
      font-weight:650;
      margin-bottom: 14px;
    }
    .powerBtn{
      min-width: 160px;
    }
    .powerBtn.off{
      border-color: rgba(255,255,255,0.18) !important;
      background: rgba(255,255,255,0.04) !important;
      color: rgba(245,250,255,0.70) !important;
    }
    .percentBig{
      font-size:48px;
      font-weight:800;
      letter-spacing: -0.5px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- Top bar -->
    <div class="topbar">
      <div class="left">
        <div class="pill" id="btnBack" title="Назад">≡</div>
        <div class="homeTitle">
          <div class="name" id="homeName">Mening uyim</div>
        </div>
      </div>
      <div class="right">
        <div class="pill" id="btnPlus" title="Добавить">＋</div>
      </div>
    </div>

    <!-- HOME SCREEN -->
    <div class="screen active" id="screenHome">
      <div class="sectionRow">
        <div class="secLeft">
          <div class="secDot"></div>
          <div id="floorName">Asosiy bo`lim</div>
        </div>
        <div class="more" id="moreText">More ›</div>
      </div>

      <div class="card">
        <div class="metaRow">
          <div class="badge" id="statusBadge">
            <span class="flame">🔥</span> <span id="statusText">Isitish</span>
          </div>
        </div>

        <div class="big">
          <div class="temp" id="tempValue">69</div>
          <div class="unit" id="tempUnit">°C</div>
        </div>

        <div class="setRow">
          <div class="setBtn heat center" id="heatSet" title="Setpoint">
            <span class="dotHeat"></span>
            <span id="heatValue">76</span>
          </div>
        </div>

        <div class="controls">
          <div class="ctrl" id="minus" title="-">−</div>
          <div class="ctrl send" id="send" title="Send">⇧</div>
          <div class="ctrl" id="plus" title="+">＋</div>
        </div>

        <div class="subHint" id="hint">
          Joriy haroratni botga yuborish uchun ⇧ tugmasini bosing
        </div>
      </div>
    </div>

    <!-- REPORTS SCREEN -->
    <div class="screen" id="screenReports">
      <div class="card" style="margin-top:14px;">
        <div class="titleCenter" id="reportsTitle">Ventilyator tezligi</div>

        <div style="display:flex;justify-content:center;margin-bottom:18px;">
          <div class="setBtn heat center powerBtn" id="powerBtn">ON</div>
        </div>

        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
          <div class="percentBig" id="percentValue">50%</div>

          <div class="controls">
            <div class="ctrl" id="percentMinus">−</div>
            <div class="ctrl" id="percentPlus">＋</div>
          </div>

          <div class="subHint" id="reportsHint">ON/OFF va 0–100% boshqaruv</div>
        </div>
      </div>
    </div>

    <!-- SETTINGS SCREEN -->
    <div class="screen" id="screenDiscover">
      <div class="card" style="margin-top:14px;">
        <div class="titleCenter" id="settingsTitle">Sozlamalar</div>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <div class="setBtn center" id="langBtn" title="Language">
            🌐 <span id="langBtnText">Til: O'zbek</span>
          </div>

          <div class="subHint" id="settingsHint">
            Tilni almashtirish uchun tugmani bosing.
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom nav -->
  <div class="bottomNav">
    <div class="navInner">
      <div class="navItem active" data-tab="home">
        <div class="icon">⌂</div>
        <div id="navHome">Uy</div>
      </div>
      <div class="navItem" data-tab="reports">
        <div class="icon">≋</div>
        <div id="navReports">Ventilyator</div>
      </div>
      <div class="navItem" data-tab="discover">
        <div class="icon">◎</div>
        <div id="navSettings">Sozlamalar</div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    // ===== Storage =====
    const STORAGE_KEY = "smarthouse_state_v1";
    const LANG_KEY = "smarthouse_lang_v1";

    function loadJson(key){
      try{
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      }catch(e){ return null; }
    }
    function saveJson(key, obj){
      try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){}
    }

    // ===== Language (UZ/RU) =====
    const i18n = {
      uz: {
        homeName: "Mening uyim",
        floorName: "Asosiy bo`lim",
        more: "More ›",
        statusText: "Isitish",
        hint: "Joriy haroratni botga yuborish uchun ⇧ tugmasini bosing",
        nav_home: "Uy",
        nav_reports: "Ventilyator",
        nav_settings: "Sozlamalar",
        reportsTitle: "Ventilyator tezligi",
        reportsHint: "ON/OFF va 0–100% boshqaruv",
        settingsTitle: "Sozlamalar",
        settingsHint: "Tilni almashtirish uchun tugmani bosing.",
        langBtnText: "Til: O'zbek",
        sentAlert: (heat) => "Yuborildi. Set: " + heat
      },
      ru: {
        homeName: "Мой дом",
        floorName: "Основной раздел",
        more: "Ещё ›",
        statusText: "Отопление",
        hint: "Чтобы отправить значение боту, нажмите ⇧",
        nav_home: "Дом",
        nav_reports: "Вентилятор",
        nav_settings: "Настройки",
        reportsTitle: "Скорость вентилятора",
        reportsHint: "ON/OFF и управление 0–100%",
        settingsTitle: "Настройки",
        settingsHint: "Нажмите кнопку, чтобы сменить язык.",
        langBtnText: "Язык: Русский",
        sentAlert: (heat) => "Отправлено. Уставка: " + heat
      }
    };

    function getLang(){
      const saved = localStorage.getItem(LANG_KEY);
      return (saved === "ru" || saved === "uz") ? saved : "uz";
    }
    function setLang(lang){
      localStorage.setItem(LANG_KEY, lang);
      applyLang();
    }

    function applyLang(){
      const lang = getLang();
      const t = i18n[lang];

      document.getElementById("homeName").textContent = t.homeName;
      document.getElementById("floorName").textContent = t.floorName;
      document.getElementById("moreText").textContent = t.more;
      document.getElementById("statusText").textContent = t.statusText;
      document.getElementById("hint").textContent = t.hint;

      document.getElementById("navHome").textContent = t.nav_home;
      document.getElementById("navReports").textContent = t.nav_reports;
      document.getElementById("navSettings").textContent = t.nav_settings;

      document.getElementById("reportsTitle").textContent = t.reportsTitle;
      document.getElementById("reportsHint").textContent = t.reportsHint;

      document.getElementById("settingsTitle").textContent = t.settingsTitle;
      document.getElementById("settingsHint").textContent = t.settingsHint;
      document.getElementById("langBtnText").textContent = t.langBtnText;
    }

    // ===== HOME (thermostat) =====
    const MIN_HEAT = 0;
    const MAX_HEAT = 100;

    let temp = 69;   // tepada ko'rinadigan joriy harorat (hozircha o'zgarmaydi)
    let heat = 76;   // olov ichidagi setpoint (o'zgaradi)

    const elTemp = document.getElementById("tempValue");
    const elHeat = document.getElementById("heatValue");
    const btnSend = document.getElementById("send");

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function setSendState(state){
      // state: "idle" | "pending" | "sent"
      btnSend.classList.remove("pending", "sent");
      if(state === "pending") btnSend.classList.add("pending");
      if(state === "sent") btnSend.classList.add("sent");
    }

    function renderHome(){
      elTemp.textContent = String(temp);
      elHeat.textContent = String(heat);
    }

    function persist(){
      saveJson(STORAGE_KEY, {
        temp, heat, powerOn, percent,
        sendState: btnSend.classList.contains("sent") ? "sent" :
                  btnSend.classList.contains("pending") ? "pending" : "idle",
        ts: Date.now()
      });
    }

    function markPending(){
      setSendState("pending"); // + / - bosilganda qizil
    }

    function sendThermostatToBot(){
      if (!tg) return;

      const payload = {
        type: "thermostat",
        temp: temp,
        heat: heat,
        ts: Date.now()
      };

      tg.sendData(JSON.stringify(payload));
      setSendState("sent"); // yuborilganda yashil
      persist();

      const lang = getLang();
      tg.showAlert(i18n[lang].sentAlert(heat));
    }

    document.getElementById("minus").addEventListener("click", () => {
      heat = clamp(heat - 1, MIN_HEAT, MAX_HEAT);
      renderHome();
      markPending();
      persist();
    });

    document.getElementById("plus").addEventListener("click", () => {
      heat = clamp(heat + 1, MIN_HEAT, MAX_HEAT);
      renderHome();
      markPending();
      persist();
    });

    btnSend.addEventListener("click", sendThermostatToBot);

    document.getElementById("heatSet").addEventListener("click", () => {
      heat = clamp(heat + 1, MIN_HEAT, MAX_HEAT);
      renderHome();
      markPending();
      persist();
    });

    // ===== REPORTS (fan control) =====
    let powerOn = true;
    let percent = 50;

    const powerBtn = document.getElementById("powerBtn");
    const percentValue = document.getElementById("percentValue");

    function renderReports(){
      percentValue.textContent = percent + "%";
      powerBtn.textContent = powerOn ? "ON" : "OFF";
      powerBtn.classList.toggle("off", !powerOn);
    }

    function sendACToBot(){
      if (!tg) return;
      const payload = {
        type: "ac_control",
        power: powerOn,
        percent: percent,
        ts: Date.now()
      };
      tg.sendData(JSON.stringify(payload));
    }

    powerBtn.addEventListener("click", () => {
      powerOn = !powerOn;
      renderReports();
      sendACToBot();
      persist();
    });

    document.getElementById("percentMinus").addEventListener("click", () => {
      percent = Math.max(0, percent - 5);
      renderReports();
      sendACToBot();
      persist();
    });

    document.getElementById("percentPlus").addEventListener("click", () => {
      percent = Math.min(100, percent + 5);
      renderReports();
      sendACToBot();
      persist();
    });

    // ===== SETTINGS (language button) =====
    document.getElementById("langBtn").addEventListener("click", () => {
      const next = getLang() === "uz" ? "ru" : "uz";
      setLang(next);
    });

    // ===== Screens switch =====
    const screens = {
      home: document.getElementById("screenHome"),
      reports: document.getElementById("screenReports"),
      discover: document.getElementById("screenDiscover"),
    };

    function showScreen(name){
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
    }

    document.querySelectorAll(".navItem").forEach((item) => {
      item.addEventListener("click", () => {
        document.querySelectorAll(".navItem").forEach(n => n.classList.remove("active"));
        item.classList.add("active");
        showScreen(item.dataset.tab);
      });
    });

    // ===== Init =====
    const saved = loadJson(STORAGE_KEY);
    if(saved){
      if(typeof saved.temp === "number") temp = saved.temp;
      if(typeof saved.heat === "number") heat = saved.heat;
      if(typeof saved.powerOn === "boolean") powerOn = saved.powerOn;
      if(typeof saved.percent === "number") percent = saved.percent;
      if(saved.sendState) setSendState(saved.sendState);
    } else {
      setSendState("idle");
    }

    applyLang();

    if (tg) {
      tg.ready();
      tg.expand();
    }

    renderHome();
    renderReports();
    persist();
  </script>
</body>
</html>
