<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smarthouse</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg: #0b1220;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.08);
      --stroke: rgba(255,255,255,0.12);
      --text: rgba(245,250,255,0.92);
      --muted: rgba(245,250,255,0.60);

      --heat: #ff7a18;

      --tg-bg: var(--tg-theme-bg-color, var(--bg));
      --tg-text: var(--tg-theme-text-color, var(--text));
      --tg-hint: var(--tg-theme-hint-color, var(--muted));
    }

    * { box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: var(--tg-bg);
      color: var(--tg-text);
    }

    .wrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 14px 14px 92px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 4px 2px 10px;
    }
    .topbar .left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .pill{
      width: 28px; height: 28px;
      border-radius: 9px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      display:flex; align-items:center; justify-content:center;
      color: var(--tg-text);
      flex: 0 0 auto;
      user-select:none;
    }
    .homeTitle{
      display:flex;
      align-items:center;
      gap:6px;
      min-width:0;
    }
    .homeTitle .name{
      font-weight: 650;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .topbar .right{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .sectionRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 6px 2px 10px;
      color: var(--tg-hint);
      font-size: 13px;
    }
    .sectionRow .secLeft{
      display:flex; align-items:center; gap:8px;
      min-width:0;
    }
    .secDot{
      width: 10px; height: 10px;
      border-radius: 3px;
      background: rgba(255,255,255,0.22);
      border: 1px solid var(--stroke);
      flex: 0 0 auto;
    }
    .sectionRow .more{
      color: var(--tg-hint);
      opacity: .9;
      user-select:none;
    }

    .card{
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .metaRow{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      color: var(--tg-hint);
      font-size: 13px;
      padding-bottom: 4px;
    }

    .badge{
      display:flex; align-items:center; gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,122,24,0.35);
      background: rgba(255,122,24,0.12);
      color: rgba(255,210,185,0.95);
      font-weight: 600;
    }
    .flame{ color: var(--heat); }

    .big{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px 0 6px;
    }
    .big .temp{
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }
    .big .unit{
      font-size: 22px;
      opacity: .75;
      margin-left: 6px;
      transform: translateY(-18px);
    }

    .setRow{
      display:flex;
      gap: 12px;
      justify-content:center;
      padding-top: 6px;
    }

    .setBtn{
      min-width: 126px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 11px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
      border: 1.5px solid var(--stroke);
      color: var(--tg-text);
      font-weight: 650;
      user-select:none;
      cursor:pointer;
    }
    .setBtn.center{
      min-width: 160px;
    }
    .setBtn.heat{
      border-color: rgba(255,122,24,0.55);
      color: rgba(255,210,185,0.98);
    }

    .dotHeat{
      width: 10px; height: 10px; border-radius: 4px;
      background: rgba(255,122,24,0.9);
      box-shadow: 0 0 12px rgba(255,122,24,0.35);
    }

    .controls{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      justify-content:center;
    }
    .ctrl{
      width: 46px; height: 46px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
      display:flex; align-items:center; justify-content:center;
      font-size: 22px;
      user-select:none;
      cursor:pointer;
    }
    .subHint{
      text-align:center;
      color: var(--tg-hint);
      font-size: 12.5px;
      margin-top: 10px;
    }

    .bottomNav{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 10px 12px 18px;
      background: linear-gradient(180deg, rgba(11,18,32,0), rgba(11,18,32,0.95) 40%, rgba(11,18,32,0.98));
      backdrop-filter: blur(10px);
    }
    .navInner{
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 10px 10px;
      display:flex;
      justify-content:space-around;
      gap: 10px;
    }
    .navItem{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      padding: 8px 6px;
      border-radius: 14px;
      color: var(--tg-hint);
      font-size: 11.5px;
      user-select:none;
    }
    .navItem.active{
      background: rgba(46,166,255,0.10);
      border: 1px solid rgba(46,166,255,0.28);
      color: rgba(220,245,255,0.95);
    }
    .icon{
      width: 22px; height: 22px;
      border-radius: 7px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
      display:flex; align-items:center; justify-content:center;
      font-size: 13px;
    }

    /* Overlay (first start) */
    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 9999;
    }
    .overlay.show{ display:flex; }

    .modal{
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
    }
    .modalTitle{
      font-size: 16px;
      font-weight: 750;
      margin-bottom: 8px;
    }
    .modalHint{
      color: var(--tg-hint);
      font-size: 13px;
      margin-bottom: 12px;
    }
    .modalRow{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:space-between;
    }
    .modalInput{
      flex: 1;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.06);
      color: var(--tg-text);
      font-size: 16px;
      padding: 0 12px;
      outline: none;
    }
    .modalBtn{
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,122,24,0.45);
      background: rgba(255,122,24,0.18);
      color: rgba(255,230,210,0.98);
      font-weight: 750;
      cursor: pointer;
      user-select:none;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- First start overlay -->
  <div class="overlay" id="firstOverlay">
    <div class="modal">
      <div class="modalTitle">Xonaning haroratini kiriting</div>
      <div class="modalHint">Masalan: 20 (°C). Keyin + / − bilan o‘zgartirasiz.</div>

      <div class="modalRow">
        <input class="modalInput" id="firstTempInput" type="number" inputmode="numeric" min="-50" max="60" step="1" placeholder="20" />
        <div class="modalBtn" id="firstTempOk">Saqlash</div>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="topbar">
      <div class="left">
        <div class="pill" id="btnBack" title="Menu">≡</div>
        <div class="homeTitle">
          <div class="name" id="homeName">My Home</div>
        </div>
      </div>
      <div class="right">
        <div class="pill" id="btnPlus" title="Add">＋</div>
      </div>
    </div>

    <div class="sectionRow">
      <div class="secLeft">
        <div class="secDot"></div>
        <div id="floorName">Asosiy xona</div>
      </div>
      <div class="more">More ›</div>
    </div>

    <div class="card">
      <div class="metaRow">
        <div class="badge" id="statusBadge">
          <span class="flame">🔥</span> <span id="statusText">Isitish</span>
        </div>
      </div>

      <!-- Big temperature -->
      <div class="big">
        <div class="temp" id="tempValue">20</div>
        <div class="unit" id="tempUnit">°C</div>
      </div>

      <!-- Orange input (same value as big temp) -->
      <div class="setRow">
        <div class="setBtn heat center" id="heatSet" style="gap:10px;">
          <span class="dotHeat"></span>
          <input
            id="targetInput"
            type="number"
            inputmode="numeric"
            min="-50"
            max="60"
            step="1"
            value="20"
            style="
              width: 72px;
              background: transparent;
              border: 0;
              outline: none;
              color: inherit;
              font: inherit;
              font-weight: 750;
              text-align: center;
            "
          />
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="ctrl" id="minus" title="-">−</div>
        <div class="ctrl" id="send" title="Apply">⇧</div>
        <div class="ctrl" id="plus" title="+">＋</div>
      </div>

      <div class="subHint" id="hint">
        Haroratni tanlang, so‘ng ⇧ tugmasini bosing
      </div>
    </div>
  </div>

  <!-- Bottom nav (visual only) -->
  <div class="bottomNav">
    <div class="navInner">
      <div class="navItem active" data-tab="home">
        <div class="icon">⌂</div>
        <div>Temperatura</div>
      </div>
      <div class="navItem" data-tab="reports">
        <div class="icon">≋</div>
        <div>Ventilyator</div>
      </div>
      <div class="navItem" data-tab="discover">
        <div class="icon">◎</div>
        <div>Sozlamalar</div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    // ====== State ======
    // "currentRoomTemp" — uyda hozirgi harorat (saqlanadi)
    // "selectedTemp" — foydalanuvchi tanlayotgan harorat (input + big temp ko‘rsatadi)
    const STORAGE_KEY = "currentRoomTemp";

    const elTemp = document.getElementById("tempValue");
    const targetInput = document.getElementById("targetInput");

    const overlay = document.getElementById("firstOverlay");
    const firstTempInput = document.getElementById("firstTempInput");
    const firstTempOk = document.getElementById("firstTempOk");

    let currentRoomTemp = null;
    let selectedTemp = 20;

    function clamp(v, min, max){
      return Math.max(min, Math.min(max, v));
    }

    function parseTemp(v){
      const n = parseInt(String(v ?? "").trim(), 10);
      if (Number.isNaN(n)) return null;
      return clamp(n, -50, 60);
    }

    function syncUI(){
      // Big temp + input always same
      elTemp.textContent = String(selectedTemp);
      targetInput.value = String(selectedTemp);
    }

    function setSelectedTemp(v){
      const t = parseTemp(v);
      if (t === null) return;
      selectedTemp = t;
      syncUI();
    }

    function saveCurrentTemp(v){
      currentRoomTemp = v;
      localStorage.setItem(STORAGE_KEY, String(v));
    }

    // ====== First start: ask room temp ======
    function showFirstOverlay(){
      overlay.classList.add("show");
      firstTempInput.value = "";
      setTimeout(() => firstTempInput.focus(), 50);
    }

    function hideFirstOverlay(){
      overlay.classList.remove("show");
    }

    function initFromStorage(){
      const saved = parseTemp(localStorage.getItem(STORAGE_KEY));
      if (saved === null) {
        showFirstOverlay();
        return;
      }
      currentRoomTemp = saved;
      selectedTemp = saved;
      syncUI();
    }

    firstTempOk.addEventListener("click", () => {
      const t = parseTemp(firstTempInput.value);
      if (t === null) {
        alert("Iltimos, haroratni son bilan kiriting (masalan: 20).");
        return;
      }
      saveCurrentTemp(t);
      selectedTemp = t;
      syncUI();
      hideFirstOverlay();
    });

    // Enter bosilsa ham saqlansin
    firstTempInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") firstTempOk.click();
    });

    // ====== Manual input sync ======
    targetInput.addEventListener("input", () => {
      setSelectedTemp(targetInput.value);
    });

    // ====== +/- buttons ======
    document.getElementById("minus").addEventListener("click", () => {
      setSelectedTemp(selectedTemp - 1);
    });

    document.getElementById("plus").addEventListener("click", () => {
      setSelectedTemp(selectedTemp + 1);
    });

    // ====== Apply (⇧) ======
    document.getElementById("send").addEventListener("click", () => {
      // "Muvaffaqiyatli o‘zgardi" — va currentRoomTemp ham shu bo‘ldi
      saveCurrentTemp(selectedTemp);

      if (tg) {
        const payload = {
          type: "set_home_temperature",
          value: selectedTemp,
          ts: Date.now()
        };
        tg.sendData(JSON.stringify(payload));
        tg.showAlert("Harorat muvaffaqiyatli o‘zgardi: " + selectedTemp + "°C");
      } else {
        alert("Harorat muvaffaqiyatli o‘zgardi: " + selectedTemp + "°C");
      }

      // UI already synced, but keep consistent:
      syncUI();
    });

    // ====== Telegram init ======
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Start
    initFromStorage();
  </script>
</body>
</html>
