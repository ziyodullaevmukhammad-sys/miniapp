<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1>Mini App работает</h1>
  <button onclick="sendData()">Отправить в бот</button>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function sendData() {
      if (tg) {
        tg.sendData("Привет от Mini App");
        tg.showAlert("Отправлено!");
      }
    }
  </script>
</body>

</html>
