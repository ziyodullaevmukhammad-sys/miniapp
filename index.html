<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smarthouse</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg: #0b1220;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.08);
      --stroke: rgba(255,255,255,0.12);
      --text: rgba(245,250,255,0.92);
      --muted: rgba(245,250,255,0.60);

      --heat: #ff7a18;
      --cool: #2ea6ff;

      --tg-bg: var(--tg-theme-bg-color, var(--bg));
      --tg-text: var(--tg-theme-text-color, var(--text));
      --tg-hint: var(--tg-theme-hint-color, var(--muted));
    }

    * { box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: var(--tg-bg);
      color: var(--tg-text);
    }

    .wrap{
      max-width: 420px;
      margin: 0 auto;
      padding: 14px 14px 92px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 4px 2px 10px;
    }
    .topbar .left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .pill{
      width: 28px; height: 28px;
      border-radius: 9px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      display:flex; align-items:center; justify-content:center;
      color: var(--tg-text);
      flex: 0 0 auto;
      user-select:none;
    }
    .homeTitle .name{
      font-weight: 650;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .topbar .right{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .sectionRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 6px 2px 10px;
      color: var(--tg-hint);
      font-size: 13px;
    }
    .sectionRow .secLeft{
      display:flex; align-items:center; gap:8px;
      min-width:0;
    }
    .secDot{
      width: 10px; height: 10px;
      border-radius: 3px;
      background: rgba(255,255,255,0.22);
      border: 1px solid var(--stroke);
      flex: 0 0 auto;
    }

    .card{
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .metaRow{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      color: var(--tg-hint);
      font-size: 13px;
      padding-bottom: 4px;
    }
    .badge{
      display:flex; align-items:center; gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,122,24,0.35);
      background: rgba(255,122,24,0.12);
      color: rgba(255,210,185,0.95);
      font-weight: 600;
    }
    .flame{ color: var(--heat); }

    .big{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 14px 0 6px;
    }
    .big .temp{
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }
    .big .unit{
      font-size: 22px;
      opacity: .75;
      margin-left: 6px;
      transform: translateY(-18px);
    }

    .setRow{
      display:flex;
      gap: 12px;
      justify-content:center;
      padding-top: 6px;
    }
    .setBtn{
      min-width: 126px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 11px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.02);
      border: 1.5px solid var(--stroke);
      color: var(--tg-text);
      font-weight: 650;
      user-select:none;
      cursor:pointer;
    }
    .setBtn.center{ min-width: 160px; }
    .setBtn.heat{
      border-color: rgba(255,122,24,0.55);
      color: rgba(255,210,185,0.98);
    }
    .dotHeat{
      width: 10px; height: 10px; border-radius: 4px;
      background: rgba(255,122,24,0.9);
      box-shadow: 0 0 12px rgba(255,122,24,0.35);
    }

    .controls{
      margin-top: 12px;
      display:flex;
      gap: 10px;
      justify-content:center;
    }
    .ctrl{
      width: 46px; height: 46px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
      display:flex; align-items:center; justify-content:center;
      font-size: 22px;
      user-select:none;
      cursor:pointer;
    }
    .subHint{
      text-align:center;
      color: var(--tg-hint);
      font-size: 12.5px;
      margin-top: 10px;
    }

    /* Bottom nav */
    .bottomNav{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 10px 12px 18px;
      background: linear-gradient(180deg, rgba(11,18,32,0), rgba(11,18,32,0.95) 40%, rgba(11,18,32,0.98));
      backdrop-filter: blur(10px);
    }
    .navInner{
      max-width: 420px;
      margin: 0 auto;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 10px 10px;
      display:flex;
      justify-content:space-around;
      gap: 10px;
    }
    .navItem{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      padding: 8px 6px;
      border-radius: 14px;
      color: var(--tg-hint);
      font-size: 11.5px;
      user-select:none;
      cursor:pointer;
      border: 1px solid transparent;
    }
    .navItem.active{
      background: rgba(46,166,255,0.10);
      border: 1px solid rgba(46,166,255,0.28);
      color: rgba(220,245,255,0.95);
    }
    .icon{
      width: 22px; height: 22px;
      border-radius: 7px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
      display:flex; align-items:center; justify-content:center;
      font-size: 13px;
    }

    /* Tabs */
    .tab{ display:none; }
    .tab.active{ display:block; }

    /* ===== Reports (AC) screen ===== */
    .acTitle{
      font-weight: 700;
      font-size: 26px;
      margin: 8px 0 14px;
      letter-spacing: .2px;
    }
    .acCard{
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.04));
      border-radius: 22px;
      padding: 16px 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .acRingWrap{
      display:flex;
      justify-content:center;
      padding: 6px 0 10px;
    }
    .acRing{
      width: 260px;
      height: 260px;
      border-radius: 999px;
      position: relative;
      border: 2px solid rgba(255,255,255,0.16);
      background:
        radial-gradient(circle at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0) 55%),
        radial-gradient(circle at center, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      overflow:hidden;
    }
    .acArc{
      position:absolute;
      inset: 10px;
      border-radius: 999px;
      border: 10px solid rgba(46,166,255,0.18);
      clip-path: polygon(50% 50%, 100% 0, 100% 100%);
      opacity: .55;
      display:none;
    }
    .acRing.on .acArc{ display:block; }

    .acCenter{
      position:absolute;
      inset: 0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap: 8px;
      text-align:center;
    }
    .acMode{
      color: var(--tg-hint);
      font-weight: 650;
      letter-spacing: .2px;
    }
    .acTemp{
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .acTempSmall{
      color: var(--tg-hint);
      font-size: 12px;
      margin-top: -2px;
    }

    .acPM{
      position:absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 54px; height: 54px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.06);
      display:flex; align-items:center; justify-content:center;
      font-size: 26px;
      user-select:none;
      cursor:pointer;
    }
    .acPM.minus{ left: 14px; }
    .acPM.plus{ right: 14px; }

    .acLimits{
      display:flex;
      justify-content:space-between;
      color: var(--tg-hint);
      font-size: 12px;
      padding: 2px 8px 0;
    }

    .acBottom{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .tile{
      border-radius: 18px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.05);
      padding: 14px;
      min-height: 92px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      user-select:none;
      cursor:pointer;
    }
    .tile.on{
      background: rgba(255, 180, 120, 0.18);
      border-color: rgba(255, 180, 120, 0.32);
    }
    .tileHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      color: var(--tg-hint);
      font-size: 13px;
      gap: 10px;
    }
    .tileValue{
      font-weight: 800;
      font-size: 22px;
    }
    .powerRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.04);
    }
    .powerLabel{
      color: var(--tg-hint);
      font-size: 13px;
      white-space:nowrap;
    }
    .powerBtns{
      display:flex; gap:10px; align-items:center;
    }
    .pbtn{
      width: 42px; height: 42px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,0.06);
      display:flex; align-items:center; justify-content:center;
      font-size: 22px;
      user-select:none;
      cursor:pointer;
    }
    .powerVal{
      min-width: 54px;
      text-align:center;
      font-weight: 800;
    }
    .range{
      width: 100%;
      accent-color: #8fd3ff;
    }

    .sendBar{
      margin-top: 12px;
      display:flex;
      justify-content:center;
    }
    .sendBtn{
      width: 100%;
      border-radius: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(46,166,255,0.38);
      background: rgba(46,166,255,0.16);
      color: rgba(230,250,255,0.95);
      font-weight: 750;
      cursor:pointer;
      user-select:none;
      text-align:center;
    }
  </style>
</head>

<body>

    <!-- Top bar -->
    <div class="topbar">
      <div class="left">
        <div class="pill" id="btnBack" title="Назад">←</div>
        <div class="homeTitle">
          <div class="name" id="homeName">My Home</div>
        </div>
      </div>
      <div class="right">
        <div class="pill" id="btnPlus" title="Добавить">＋</div>
      </div>
    </div>

    <!-- ===== TAB: HOME ===== -->
    <div class="tab active" id="tab-home">
      <div class="sectionRow">
        <div class="secLeft">

          <div id="floorName">Main Floor</div>
        </div>

        <div class="metaRow">
          <div class="badge" id="statusBadge">
            <span class="flame">🔥</span> <span id="statusText">Heating</span>
          </div>
        </div>

        <div class="big">
          <div class="temp" id="tempValue">69</div>
          <div class="unit" id="tempUnit">°C</div>
        </div>

        <div class="setRow">
          <div class="setBtn heat center" id="heatSet">
            <span class="dotHeat"></span>
            <span>76</span>
          </div>
        </div>

        <div class="controls">
          <div class="ctrl" id="minus" title="-">−</div>
          <div class="ctrl" id="send" title="Send">⇧</div>
          <div class="ctrl" id="plus" title="+">＋</div>
        </div>

        <div class="subHint" id="hint">
          Нажми ⇧ чтобы отправить текущую температуру боту
        </div>
      </div>
    </div>

    <!-- ===== TAB: REPORTS (AC) ===== -->
    <div class="tab" id="tab-reports">
      <div class="acTitle">Air Conditioner</div>

      <div class="acCard">
        <div class="acRingWrap">
          <div class="acRing" id="acRing">
            <div class="acArc"></div>

            <div class="acPM minus" id="acTempMinus">−</div>
            <div class="acPM plus" id="acTempPlus">+</div>

            <div class="acCenter">
              <div class="acMode" id="acMode">Cooling</div>
              <div class="acTemp"><span id="acTemp">24.5</span>°</div>
              <div class="acTempSmall">°C</div>
            </div>
          </div>
        </div>

        <div class="acLimits">
          <div><span id="acMin">16</span>°C</div>
          <div><span id="acMax">32</span>°C</div>
        </div>

          <div class="powerLabel">Power (0–100%)</div>
          <div class="
